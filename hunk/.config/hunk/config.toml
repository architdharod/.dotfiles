# Hunk — desktop-inspired terminal diff viewer
# https://github.com/modem-dev/hunk
# Stowed to ~/.config/hunk/config.toml

theme = "catppuccin-mocha"   # Catppuccin dark; other variants: -macchiato, -frappe, -latte
mode = "auto"                # auto, split, stack
vcs = "git"                  # git, jj, sl
watch = false                # auto-reload when the diff input changes
exclude_untracked = false    # hide untracked files in working-tree reviews
line_numbers = true
wrap_lines = false
menu_bar = true
agent_notes = true           # show agent notes by default
transparent_background = false
